appId: ir.myshop.accounting
productName: MyShopAccounting
copyright: نرم‌افزار حسابداری فروشگاه
directories:
  output: dist
  buildResources: build

files:
  - package.json
  - src/**/*
  - '!src/**/*.map'
  - '!**/.native-cache'

asar: true
asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'

npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

afterPack: scripts/after-pack.js

win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  executableName: MyShopAccounting
  artifactName: MyShopAccounting-${version}-${arch}.${ext}
  legalTrademarks: MyShop Accounting

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: false
  shortcutName: حسابداری فروشگاه
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  artifactName: MyShopAccounting-Setup.${ext}
  uninstallDisplayName: حسابداری فروشگاه

portable:
  artifactName: MyShopAccounting-Portable.${ext}
  requestExecutionLevel: user

linux:
  target: [AppImage]
  category: Office
  icon: build/icon.png
