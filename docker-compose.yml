# ---------------------------------------------------------------------------
# Baimar Lead Intelligence — development stack
#
#   docker compose up -d          start everything
#   docker compose logs -f api    follow the API
#   docker compose down           stop (data survives in the named volumes)
#
# For production use docker-compose.prod.yml, which adds Nginx and a dedicated
# worker container.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baimar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baimar}
      POSTGRES_DB: ${POSTGRES_DB:-baimar}
      # Persian text sorts correctly under ICU; the C collation would order it wrongly.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-baimar} -d ${POSTGRES_DB:-baimar}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Queues must survive a restart, so persistence is on. maxmemory-policy is
    # noeviction: silently dropping a queued job would lose work.
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-baimar}:${POSTGRES_PASSWORD:-baimar}@postgres:5432/${POSTGRES_DB:-baimar}?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # In the development stack the API also runs the queue workers.
      RUN_WORKERS_IN_API: 'true'
    env_file:
      - .env
    ports:
      - '${API_PORT:-4000}:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  postgres-data:
  redis-data:
