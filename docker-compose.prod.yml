# ---------------------------------------------------------------------------
# Baimar Lead Intelligence — production stack
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the development stack:
#   * a dedicated worker container, so a long crawl never competes with an HTTP
#     request for CPU;
#   * Nginx terminates TLS and is the only exposed port;
#   * Postgres and Redis have NO `ports:` mapping — they are reachable only over
#     the internal Docker network. Do not add one: exposing 5432 or 6379 on a
#     public VPS is the single most common way these deployments get breached;
#   * every secret must be set explicitly — no `:-default` fallbacks;
#   * memory limits sized for a 2 CPU / 4 GB VPS.
#
# Copy .env.production.example to .env first, then `npm run production:check`.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-baimar}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-baimar}']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    restart: always
    # Queues must survive a restart, so persistence stays on. maxmemory-policy is
    # noeviction: silently dropping a queued job would lose a lead's pipeline run.
    # Redis is a cache and a queue here, never the source of truth — see
    # docs/DEPLOYMENT.md § Backups.
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
      ${REDIS_EXTRA_ARGS:-}
    volumes:
      - redis-data:/data
    # Redis listens only on the internal network. To add a password anyway, set
    # REDIS_EXTRA_ARGS=--requirepass yourpassword and point REDIS_URL at
    # redis://:yourpassword@redis:6379 (REDISCLI_AUTH keeps it out of `ps`).
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 320m

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-baimar}?schema=public
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TRUST_PROXY: 'true'
      # Fail the deploy, not the security review: compose refuses to start when a
      # secret is missing rather than letting a default slip into production.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — openssl rand -base64 48}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env — openssl rand -base64 48}
      # Workers run in their own container.
      RUN_WORKERS_IN_API: 'false'
    env_file:
      - .env
    # `expose` publishes nothing to the host: only Nginx can reach this port.
    expose:
      - '4000'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    command: ['node', 'apps/api/dist/worker.js']
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-baimar}?schema=public
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      # This container *is* the worker (dist/worker.js), so the in-API flag is
      # irrelevant here; it is set false to keep the two containers symmetrical.
      RUN_WORKERS_IN_API: 'false'
      # The API container already ran them.
      RUN_MIGRATIONS: 'false'
      RUN_SEED: 'false'
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 768m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to the public API URL}
    restart: always
    depends_on:
      - api
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - web
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/locations.conf:/etc/nginx/locations.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot
      - nginx-cache:/var/cache/nginx
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  postgres-data:
  redis-data:
  nginx-cache:
