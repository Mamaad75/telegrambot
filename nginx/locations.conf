# ---------------------------------------------------------------------------
# Shared location blocks, included by both the HTTP and the HTTPS server.
#
# Keeping them in one file is not cosmetic: when they were duplicated, enabling
# TLS meant copying twelve blocks by hand, and the copy drifted.
# ---------------------------------------------------------------------------

# Security headers. The dashboard is an internal tool: never framed, never indexed.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Liveness and readiness, for the load balancer and for `docker compose ps`.
location = /health {
  proxy_pass http://baimar_api/health;
  access_log off;
  proxy_set_header Host $host;
}

location = /ready {
  proxy_pass http://baimar_api/ready;
  access_log off;
  proxy_set_header Host $host;
}

# ---------------------------------------------------------------------------
# Authentication endpoints get their own, much stricter bucket.
#
# Credential stuffing is a volume attack: 1 request/second with a burst of 5 is
# far more than a human needs and far less than a script wants. The API applies
# its own per-account limit on top of this — the edge limit only blunts the flood
# before it reaches Node.
# ---------------------------------------------------------------------------
location ~ ^/api/auth/(login|refresh|password|forgot|reset) {
  limit_req zone=login burst=5 nodelay;
  limit_req_status 429;
  # A login body is a few hundred bytes; anything larger is not a login.
  client_max_body_size 16k;

  proxy_pass http://baimar_api;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
}

# CSV import is the only endpoint that legitimately receives megabytes.
location = /api/leads/import {
  limit_req zone=api burst=10 nodelay;
  client_max_body_size 8m;

  proxy_pass http://baimar_api;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_request_buffering on;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}

location /api/ {
  limit_req zone=api burst=40 nodelay;
  limit_req_status 429;
  # Everything else is JSON: 1 MB is generous and keeps a malformed or hostile
  # body from reaching the Node process at all.
  client_max_body_size 1m;

  proxy_pass http://baimar_api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_connect_timeout 5s;
  # A campaign export or a slow provider call can legitimately take minutes.
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  proxy_buffering on;
  proxy_buffers 8 16k;
  proxy_busy_buffers_size 32k;
}

# Next.js build assets are content-hashed and safe to cache hard.
location /_next/static/ {
  proxy_pass http://baimar_web;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  expires 1y;
  add_header Cache-Control "public, immutable";
}

# Next.js dev/HMR and any future server-sent events need the upgrade headers.
location / {
  limit_req zone=web burst=60 nodelay;
  client_max_body_size 1m;

  proxy_pass http://baimar_web;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
}
