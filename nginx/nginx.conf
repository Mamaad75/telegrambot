# ---------------------------------------------------------------------------
# Baimar Lead Intelligence — reverse proxy
#
# Terminates TLS, serves the dashboard, and proxies /api and /health to the API.
# Sized for a 2 CPU VPS.
#
# TLS: drop your certificate and key into ./nginx/certs as fullchain.pem and
# privkey.pem (certbot's output works as-is), then uncomment the 443 server
# block and the HTTP redirect.
# ---------------------------------------------------------------------------

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 32m;   # CSV imports arrive as a JSON body

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/xml image/svg+xml font/woff font/woff2;

  # Modest rate limits at the edge. The API applies its own per-account limits;
  # this layer only blunts blunt-force traffic.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

  upstream baimar_api {
    server api:4000;
    keepalive 16;
  }

  upstream baimar_web {
    server web:3000;
    keepalive 16;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # --- Uncomment once certificates are in place -------------------------
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # location / { return 301 https://$host$request_uri; }
    # ----------------------------------------------------------------------

    include /etc/nginx/conf.d/baimar-locations.conf*;

    # Security headers. The dashboard is an internal tool and must never be
    # framed or indexed.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /health {
      proxy_pass http://baimar_api/health;
      access_log off;
    }

    location /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://baimar_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://baimar_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # A campaign export or a slow provider call can take a while.
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }

    # Next.js build assets are content-hashed and safe to cache hard.
    location /_next/static/ {
      proxy_pass http://baimar_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      proxy_pass http://baimar_web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # --- HTTPS. Uncomment after placing certificates in ./nginx/certs --------
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name baimar.example.ir;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #   ssl_prefer_server_ciphers off;
  #   ssl_session_cache   shared:SSL:10m;
  #   ssl_session_timeout 1d;
  #
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   add_header X-Frame-Options "DENY" always;
  #   add_header X-Content-Type-Options "nosniff" always;
  #   add_header X-Robots-Tag "noindex, nofollow" always;
  #
  #   # Copy the location blocks from the port-80 server above.
  # }
}
