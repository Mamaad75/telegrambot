# ---------------------------------------------------------------------------
# Baimar Lead Intelligence — reverse proxy
#
# Terminates TLS, serves the dashboard, and proxies /api, /health and /ready to
# the API. Sized for a 2 CPU VPS.
#
# TLS: drop your certificate and key into ./nginx/certs as fullchain.pem and
# privkey.pem (certbot's output works as-is), then swap the two `include`
# directives at the bottom of the port-80 server for the redirect line and
# uncomment the 443 block. The location blocks themselves live in
# locations.conf and are shared by both servers, so enabling TLS never means
# copying them by hand.
#
# Brotli is deliberately absent: nginx:alpine ships without ngx_brotli, and a
# config referencing a module that is not compiled in refuses to start. gzip
# covers the same content types. To add Brotli, build an image with the module
# and add `brotli on; brotli_types …` next to the gzip block below.
# ---------------------------------------------------------------------------

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # Global ceiling. Individual locations tighten it further: 16k for login,
  # 1m for the JSON API, 8m for CSV import.
  client_max_body_size 8m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  client_body_buffer_size 128k;
  large_client_header_buffers 4 16k;

  # Slowloris and connection-exhaustion guard.
  reset_timedout_connection on;
  send_timeout 30s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/xml image/svg+xml font/woff font/woff2;

  # Rate-limit buckets. The API applies its own per-account limits; this layer
  # only blunts blunt-force traffic before it reaches Node.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=web:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
  limit_req_status 429;

  # Cap concurrent connections per client so one host cannot hold every worker slot.
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_conn_status 429;

  upstream baimar_api {
    server api:4000;
    keepalive 16;
  }

  upstream baimar_web {
    server web:3000;
    keepalive 16;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;
    limit_conn perip 40;

    # Certbot's webroot challenge, always available.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # --- With TLS enabled, replace the include below with this redirect ------
    # location / { return 301 https://$host$request_uri; }
    # -------------------------------------------------------------------------

    include /etc/nginx/locations.conf;
  }

  # --- HTTPS. Uncomment after placing certificates in ./nginx/certs ----------
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name leads.example.ir;
  #   limit_conn perip 40;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #   ssl_prefer_server_ciphers off;
  #   ssl_session_cache   shared:SSL:10m;
  #   ssl_session_timeout 1d;
  #   ssl_stapling on;
  #   ssl_stapling_verify on;
  #
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #
  #   # The same locations as the HTTP server — no duplication, no drift.
  #   include /etc/nginx/locations.conf;
  # }
}
